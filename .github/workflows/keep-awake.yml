name: Keep live demo awake
# Streamlit Community Cloud sleeps apps after a stretch without visitors.
# This opens the demo in a headless browser like a visitor would, and wakes it if it is asleep.
# Disable it any time from the Actions tab.
on:
  schedule:
    - cron: '17 */8 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - name: Open the demo
        env:
          DEMO_URL: https://support-autopilot-demo.streamlit.app/
        run: |
          python - <<'EOF'
          import os, re, sys, time
          from playwright.sync_api import sync_playwright

          def page_text(page):
              texts = []
              for frame in page.frames:
                  try:
                      texts.append(frame.inner_text("body", timeout=2_000))
                  except Exception:
                      pass
              return " ".join(texts)

          with sync_playwright() as p:
              page = p.chromium.launch().new_page()
              page.goto(os.environ["DEMO_URL"], wait_until="domcontentloaded", timeout=120_000)
              page.wait_for_timeout(10_000)
              wake = page.get_by_role("button", name=re.compile("get this app back up", re.I))
              if wake.count():
                  print("App was asleep; waking it.")
                  wake.first.click()
              deadline = time.time() + 180
              while time.time() < deadline:
                  text = page_text(page)
                  if "has encountered an error" in text:
                      sys.exit("The live demo is showing an error page. Reboot it from Manage app on Streamlit.")
                  if "Ticket queue" in text:
                      print("Dashboard rendered.")
                      break
                  page.wait_for_timeout(5_000)
              else:
                  sys.exit("The live demo did not render within 3 minutes.")
          EOF
